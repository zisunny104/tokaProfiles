name: tokaProfiles
main: dev.toka.profiles.Main
version: 0.1.4
api: ["1.0.0"]
author: zisunny104
load: STARTUP
commands:
  profiles:
    description: 玩家資料與城市通入口；OP 可用 /profiles title 修改稱號
    usage: /profiles [title|titles <玩家名稱或 UUID> [稱號 | clear]]
    aliases: [profile]
    permission: tokaProfiles.self
permissions:
  tokaProfiles.self:
    default: true
  tokaProfiles.title.admin:
    description: 查看與修改玩家稱號
    default: op
