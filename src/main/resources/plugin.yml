name: tokaProfiles
main: dev.toka.profiles.Main
version: 0.2.3
api: ["1.0.0"]
author: zisunny104
load: STARTUP
softdepend: [Plan]
description: Nukkit 玩家身分、偏好與稱號服務，並提供背景分批資料搬遷
commands:
  profiles:
    description: 玩家資料與城市通入口；OP 可用 /profiles title 修改稱號
    usage: "/profiles [help | title|titles <玩家名稱或 UUID> [稱號 | clear]]（/profiles help 查看完整說明）"
    aliases: [profile]
    permission: tokaProfiles.self
permissions:
  tokaProfiles.self:
    description: 開啟城市通並查看個人資料（/profiles、/profiles help）
    default: true
  tokaProfiles.title.admin:
    description: 查看與修改玩家稱號（/profiles title）
    default: op


  tokaProfiles.admin:
    description: 管理 Plan 展示設定
    default: op
