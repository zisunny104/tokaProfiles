    notSaved: "§7[玩家資料]§r §c稱號未儲存：${0}"
    # ${0}＝輸入的 UUID
    noUuid: "§7[玩家資料]§r §c找不到這個 UUID 的玩家資料：${0}"
    # ${0}＝輸入的玩家名稱
    noPlayer: "§7[玩家資料]§r §c找不到玩家「${0}」的資料"
    ambiguous: "§7[玩家資料]§r §c「${0}」對應到多筆玩家資料，需改用 UUID"
  # 以下為啟動與遷移流程的例外訊息（會寫進後台 log，給管理員判讀），不含前綴
  path:
    outside: "路徑必須位於插件資料目錄內"
