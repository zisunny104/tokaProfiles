welcome:
  # 新玩家第一次進服看到的引導（依序顯示，最後一頁按「開始遊玩」才算完成）。${0}＝玩家名稱。
  page1:
    title: "KASTW - 歡迎加入"
    text: "玩家 ${0} 您好! 歡迎加入 ' KAS.TW幻月殤恆伺服器' .\n我們是一個台灣的MCBE生存伺服器, \n由服主紅茶於2013年7月創立. \n\n>>在正式開始遊玩前 請先閱讀完我們的引導\n希望能幫助到你 並且是必讀的\n\n點擊 '下一頁' 繼續>>\n"
  page2:
    title: "KASTW - 如何開始"
    text: ">>資訊\n頂部和底部可以看到許多資訊，村落是進服自動分配，暫時不能更改，銀幣是主要貨幣，金幣可以透過贊助或活動取得，大部分伺服器的提示會出現在頂部，像是廣播，你可以從裡面得到一些有用的訊息。\n我們的官網是 site.kastw.cc ，你可以從這裡加入我們的社群討論，也可投票或贊助支持我們。\n\n>>第一件事\n首先是採集資源，一切都是這麼開始的。\n你可以透過物品欄中的'城市通'，或是在重生點右側的'傳送區'，點擊告示牌進行傳送。\n資源區有玩家建設的公民樹場及農田，或是有其他玩家提供的物資，歡迎使用，並請發揮公德心，不要隨意破壞。\n\n>>商店\n採集資源不僅可以獲得物品本身及挖礦獎勵，還可以拿到商店販售。\n或是你可以在這裡購買需要的物品。\n透過城市通的傳送選單可以傳送至任一間商店。\n點擊告示牌販售物品，賺取銀幣，之後就可以開始蓋家了!\n\n>>領地\n建築前記得要購買領地，依照選區大小有不同的售價，將用銀幣計算。\n根據一進來分配到的村落，你可以透過傳送區或城市通傳送至你所在的區域，購買領地將會有較優惠的價格。\n你需要準備一支木鋤，分別以破壞與點擊選取對角，如在和平之地須包含高度，其他區域則不用。\n接著在選區內使用指令'/land tpl' 設置領地傳送點。\n最後使用指令'/land set <領地名稱>' 將會自動扣款並發送設置完成訊息，領地即設置完成。\n或是觀看由玩家拍攝的領地設置介紹:\n>> https://www.youtube.com/watch?v=XAkAyPk45Vc\n\n>>伺服器規章\n遊玩大致就是這樣，接著請閱讀伺服器規章，你必須遵守它。\n\n點擊下一頁繼續>>\n"
  page3:
    title: "KASTW - 伺服規章"
    text: "地圖\n所有世界均有管理員協助維護，若一般玩家發現有建設到一半且長期閒置或零星雜亂方塊的行為，請將畫面截圖私訊專頁，將會由管理員判斷並進行處理。若隨意拆除，造成其他玩家權益受損或破壞遊戲平衡，將會是形況扣除犯案玩家部分物資及伺服器貨幣，慣犯將會是情形加重或處以封禁處分。 \n\"和平之地(sunhoi)\"為生存地圖，道路、步道等基礎建設均不得任意破壞，在開發的同時請注意自然環境美觀。若有經管理員判定不合之開發事件，如當事玩家如在線，將會輔導其前往所屬的城市或視情況協助改建，若該玩家不在線或經規勸仍不配合，將由管理員進行拆除，視情況退還物資及領地地價之銀幣，以維護伺服整體品質。\n全伺服僅限\"資源區(resource)\"可供挖礦採集，其他世界(區域)將禁止該項行為，並歡迎玩家提出有效證據向專頁私訊檢舉。若查證屬實，將處以封禁處分。\n\"資源區(resource)\"為資源採集地，該世界禁止私設領地，原則上於該世界之物資均可開採，但若有類似臨時倉庫、物資運送軌道、通過地形之道路建設，請勿惡意破壞，若有玩家提出有效證據向專頁私訊檢舉，查實後將直接封禁。\n主世界(chuklok)及其所包含區域*，玩家之建築物均不得更動道路本體及其上方5格高，若該建物包含領地，將會由管理員進行改建以符合規範，若無領地，將直接拆除，不另通知。\n主世界(chuklok)僅由\"西門鐵路\"提供軌道運輸經營，不得私建軌道相關建設。違者可由維護人員直接拆除。\n各世界中，如有玩家未設領地所造成的物品損失，將不會補償，若有因他人未設置領地而進入領地內獲取他人物品，經發現處封禁。\n資源地獄(nether)開放期間，相關規定比照資源區。\n\n\n*主世界包含區域有西門市、幻影村、道卡村、凜喵市。\n\n聊天室\n禁止要求管理員給予權限(管理、創造、特權等)。\n禁止使用不雅用語，包含私訊中。\n禁止惡意刷屏，或是惡意私訊。\n禁止為其他伺服器宣傳(包含告示牌)。\n禁止以噁心稱謂互相稱呼 。\n要求管理員販售未在商店販售之物品，視情況封禁。\n以上行為視情形警告後不聽勸者處以封禁處分\n\n其他\n禁止未經他人同意登入他人帳號，若有發生違規行為將以犯案帳號作為封禁對象。\n各玩家於首次入服時將會自動分配村落，玩家若對於所分配之村落不滿意，目前尚未提供轉移村落的方案，預計未來更新加入。\n持有非法物品(無法以正常遊戲情況獲得)，將直接清空玩家背包。\n針對惡意腳本(外掛)，經玩家檢舉並查實後，將直接封禁。\n社團\n若有爭議性言論者，將視情況禁言及開啟貼文審查。\n申訴\n若對於帳號遭封禁有異議者，於封禁日後十日內私信專頁玩家代號，將協助查詢，並再次判定是否給予封禁處分。若超過申訴期限，將不受理申訴。\n若帳號因\"關聯帳號\"而遭封禁，如需申訴，需原被封禁帳號進行申訴，方可受理。若為\"關聯帳號(直接相關)\"將不受理任何申訴。該關聯係由系統判定，非管理員人工判斷，將不會針對單一帳號特定處理。"
  page4:
    title: "KASTW - 基礎指令"
    text: "接下來是一些可能會用到的指令\n\n/pay <玩家> <金額> - 支付指定金額給指定玩家\n/balance - 查看餘額\n/tpp  - 顯示傳送點列表\n/spawn - 回到重生點\n/land - 顯示領地指令相關幫助\n/tpl - 顯示領地傳送列表\n"
  page5:
    title: "KASTW - 開心遊玩"
    text: "你已經了解了伺服器基本的玩法了\n希望你能遵守規則 並玩得盡興 "
  next: "下一頁"
  start: "開始遊玩"
  # ${0}＝玩家名稱
  ready: "§e>>§b玩家 ${0} 已經準備好要開始在幻月服的生活了呢 d(`･∀･)b§r"
