# tokaProfiles 繁體中文語系檔（zh-TW）
#
# 這個檔案放著插件所有「使用者看得到的文字」。伺服器擁有者可以把同名檔放進
# plugins/tokaProfiles/lang/zh-TW.yml 覆蓋個別文字，沒寫到的 key 仍使用 jar 內建的內容。
# 語言由 config.yml 的 language 決定。
#
# 參數：${0}、${1}… 依序代表程式傳入的值（只替換一次，缺少時保留原樣並警告）。
# 色碼慣例（與 tokaI18n 一致）：
#   §b 一般文字　§a 數字／名稱／值（寫成 §a${0}§b）　§e 警告／指令　§c 錯誤與拒絕
#   §7 用法與補充說明　§6 標題　§r 重設樣式
#   後台 log 不加方括號標籤；玩家訊息固定使用前綴「§7[玩家資料]§r 」。
# 命令列工具（StagedProfileMigration、ProfileMigration、PlanResolution）輸出的
# PROFILE_IMPORT_PASS、STAGE_RESULT 等結果標記是給腳本判讀的穩定 code，不翻譯、不放在這裡。

# ───────────────────────── 指令說明與用法（cmd） ─────────────────────────
cmd:
  profiles:
    # /profiles title 的用法
    usageTitle: "/profiles title <玩家名稱或 UUID> [稱號 | clear]"

# ───────────────────────── /profiles help（help） ─────────────────────────
# help.profiles：每行格式為「標籤|內容」，依權限過濾後顯示（標籤與 | 不會顯示）：
#   *       所有人都顯示
#   title   需要 tokaProfiles.title.admin 權限
#   self    需要 tokaProfiles.title.self 權限
# ${0}＝稱號長度上限（目前 255）
help:
  profiles:
    - "*|§6=== §f§ltokaProfiles 說明§r §6=== §7（別名 /profile；<必填>、[選填]）"
    - "*|§e/profiles §7- §b開啟城市通（個人資料，限遊戲內玩家）"
    - "*|§e/profiles help §7- §b顯示此說明"
    - "self|§e/profiles mytitle §7- §b查看自己的稱號"
    - "self|§e/profiles mytitle <稱號> §7- §b設定自己的稱號（有長度限制與等待時間；色碼需要另外的權限，用 & 代替 §）"
    - "self|§e/profiles mytitle clear §7- §b清除自己的稱號"
    - "title|§e/profiles title <玩家名稱或 UUID> §7- §b查看該玩家目前的稱號"
    - "title|§e/profiles title <玩家名稱或 UUID> <稱號> §7- §b設定稱號（可含空白與 § 色碼，最長 ${0} 個字元，不可含控制字元）"
    - "title|§e/profiles title <玩家名稱或 UUID> clear §7- §b清除稱號"
    - "title|§7/profiles titles 與 /profiles title 相同；名稱對應多位玩家時用 UUID"
    - "title|§6§l遷移與盤點工具 §7（命令列 java -cp tokaProfiles-<版本>.jar 執行，需先停服）"
    - "title|§edev.toka.profiles.migration.StagedProfileMigration stage <來源.json> <sqlite|json|yaml> <新stage目錄> [批次筆數 間隔毫秒 [Plan證據.json]] §7- §b背景分批搬遷到獨立資料集，不啟用正式資料"
    - "title|§edev.toka.profiles.migration.StagedProfileMigration verify <stage目錄> <目前來源.json> <sqlite|json|yaml> §7- §b重啟前驗證 stage 與目前來源一致，不執行切換"
    - "title|§edev.toka.profiles.migration.ProfileMigration import <來源.json> <sqlite|json|yaml> <新資料目錄> <備份目錄> §7- §b離線一次性匯入並備份、讀回比對"
    - "title|§edev.toka.profiles.migration.ProfileMigration export-jdbc <jdbc:mysql:網址> <帳號> <輸出.json> §7- §b唯讀匯出 playerData 快照（密碼用 TOKA_DB_PASSWORD 或互動輸入）"
    - "title|§edev.toka.profiles.migration.ProfileMigration plan-permissions <來源.json> <輸出檔> §7- §b產生未審核的 LuckPerms 身分群組指令提案，不會執行"
    - "title|§edev.toka.profiles.migration.PlanResolution <來源.json> <Plan證據.json> <新私人目錄> §7- §b離線身分對照與封存輸出，不寫入正式資料"
    - "title|§7設定檔 staged.*（背景搬遷）與 migration.*（離線匯入）的說明見 config.yml 內的註解"

# ───────────────────────── 玩家／指令訊息（msg） ─────────────────────────
msg:
  title:
    # 查看稱號；${0}＝玩家名稱，${1}＝稱號（沒有時為 status.noTitle）
    show: "§7[玩家資料]§r §a${0}§b 的稱號：§a${1}"
    # 清除稱號；${0}＝玩家名稱
    cleared: "§7[玩家資料]§r §a已清除 ${0} 的稱號"
    # 自己的稱號；${0}＝稱號（沒有時為 status.noTitle）
    mine: "§7[玩家資料]§r §b你的稱號：§a${0}"
    mineCleared: "§7[玩家資料]§r §a已清除你的稱號"
    # ${0}＝新稱號
    mineSet: "§7[玩家資料]§r §a你的稱號已設為：§r${0}"
