# ───────────────────────── 表單與命令列提示（ui） ─────────────────────────
ui:
  cityPass:
    # 城市通表單標題
    title: "城市通"
    # 內容；${0}＝玩家名稱，${1}＝識別碼（profileId）。表單內不使用色碼
    content: "玩家：${0}\n識別碼：${1}"
    # 找不到玩家資料時的內容
    noData: "尚未完成玩家資料搬遷。"
    close: "關閉"
  # 命令列匯出工具要求輸入資料庫密碼時的提示
  passwordPrompt: "資料庫密碼："

# ───────────────────────── 後台文字（log） ─────────────────────────
log:
