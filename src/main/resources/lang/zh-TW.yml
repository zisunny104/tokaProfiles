  title:
    # ${0}＝長度上限
    tooLong: "§7[玩家資料]§r §c稱號最長 ${0} 個字元"
    control: "§7[玩家資料]§r §c稱號不能包含控制字元或換行"
    selfNoProfile: "§7[玩家資料]§r §c找不到你的玩家資料，稱號未更動。"
    selfColour: "§7[玩家資料]§r §c你沒有使用色碼的權限，稱號不能含 § 或 &。"
