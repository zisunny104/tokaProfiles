welcome:
  # 新玩家第一次進服看到的引導（一頁，按「開始遊玩」才算完成）。${0}＝玩家名稱。
  page1:
    title: "KASTW - 歡迎加入"
    text: "嗨 ${0}，歡迎來到 §aKAS.TW§b 幻月殤恆生存伺服器§r！
我們是台灣的 MCBE 生存伺服器，從 2013 年一路玩到現在。這一頁幫你認識這裡，讀完就能出發囉。

§e>>先認識幾個地方§r
§b重生點§r：旁邊的傳送區可以直接去各處，身上的城市通（指南針）也能開傳送選單。
§b資源區§r：想挖礦、砍樹、蒐集材料就來這裡，全服只有這裡可以採集。
§b城市§r：你一進來就被分配了一座城市，在自己的城市買領地有優惠喔。
§b商店§r：把採來的東西賣掉賺銀幣，也可以買需要的東西，輸入 /shop 就能開商店。

§e>>錢與領地§r
銀幣是主要貨幣，金幣來自贊助和活動。要蓋房子先買領地：用木鋤破壞與點擊選出對角，再輸入 /land set <領地名稱>，/land tpl 設傳送點。

§e>>加入 Discord§r
歡迎加入我們的 Discord 社群！把遊戲帳號綁定後，Discord 和遊戲裡可以互通聊天、使用指令。綁定三步驟：
1. 在遊戲輸入 §b/discord link§r，會得到一組綁定代碼
2. 到 Discord，輸入 §b/link code:你的代碼§r
3. 看到「綁定完成」就好了；代碼只能用一次，不要給別人

§e>>遊玩公約§r
‧ 和平都是生存地圖，領地是立體的，範圍包含高度
‧ 和平都不能挖礦、砍樹等採集，請到資源區
‧ 和平都的道路與步道不能破壞
‧ 主世界城市的道路與上方 5 格不能更動
‧ 不破壞別人的建設
‧ 不使用外掛或非法物品
‧ 不向管理員要權限
‧ 說話文明、不刷屏
違規會依情節警告、扣除物資或封禁；有疑問或要申訴，請到 Discord 群組回報。

§a準備好了就出發吧，玩得開心！§r"
