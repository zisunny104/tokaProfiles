# tokaProfiles 繁體中文語系檔（zh-TW）
#
# 這個檔案放著插件所有「使用者看得到的文字」。伺服器擁有者可以把同名檔放進
# plugins/tokaProfiles/lang/zh-TW.yml 覆蓋個別文字，沒寫到的 key 仍使用 jar 內建的內容。
# 語言由 config.yml 的 language 決定。
#
# 參數：${0}、${1}… 依序代表程式傳入的值（只替換一次，缺少時保留原樣並警告）。
# 色碼慣例（與 tokaI18n 一致）：
#   §b 一般文字　§a 數字／名稱／值（寫成 §a${0}§b）　§e 警告／指令　§c 錯誤與拒絕
#   §7 用法與補充說明　§6 標題　§r 重設樣式
#   後台 log 不加方括號標籤；玩家訊息固定使用前綴「§7[玩家資料]§r 」。
# 命令列工具（StagedProfileMigration、ProfileMigration、PlanResolution）輸出的
# PROFILE_IMPORT_PASS、STAGE_RESULT 等結果標記是給腳本判讀的穩定 code，不翻譯、不放在這裡。

# ───────────────────────── 指令說明與用法（cmd） ─────────────────────────
cmd:
  profiles:
    # /profiles title 的用法
    usageTitle: "/profiles title <玩家名稱或 UUID> [稱號 | clear]"

# ───────────────────────── /profiles help（help） ─────────────────────────
# help.profiles：每行格式為「標籤|內容」，依權限過濾後顯示（標籤與 | 不會顯示）：
#   *       所有人都顯示
#   title   需要 tokaProfiles.title.admin 權限
#   self    需要 tokaProfiles.title.self 權限
# ${0}＝稱號長度上限（目前 255）
help:
  profiles:
    - "*|§6=== §f§ltokaProfiles 說明§r §6=== §7（別名 /profile；<必填>、[選填]）"
    - "*|§e/profiles §7- §b開啟城市通（個人資料，限遊戲內玩家）"
    - "*|§e/profiles help §7- §b顯示此說明"
    - "self|§e/profiles mytitle §7- §b查看自己的稱號"
    - "self|§e/profiles mytitle <稱號> §7- §b設定自己的稱號（有長度限制與等待時間；色碼需要另外的權限，用 & 代替 §）"
    - "self|§e/profiles mytitle clear §7- §b清除自己的稱號"
    - "title|§e/profiles title <玩家名稱或 UUID> §7- §b查看該玩家目前的稱號"
    - "title|§e/profiles title <玩家名稱或 UUID> <稱號> §7- §b設定稱號（可含空白與 § 色碼，最長 ${0} 個字元，不可含控制字元）"
    - "title|§e/profiles title <玩家名稱或 UUID> clear §7- §b清除稱號"
    - "title|§7/profiles titles 與 /profiles title 相同；名稱對應多位玩家時用 UUID"
    - "title|§6§l遷移與盤點工具 §7（命令列 java -cp tokaProfiles-<版本>.jar 執行，需先停服）"
    - "title|§edev.toka.profiles.migration.StagedProfileMigration stage <來源.json> <sqlite|json|yaml> <新stage目錄> [批次筆數 間隔毫秒 [Plan證據.json]] §7- §b背景分批搬遷到獨立資料集，不啟用正式資料"
    - "title|§edev.toka.profiles.migration.StagedProfileMigration verify <stage目錄> <目前來源.json> <sqlite|json|yaml> §7- §b重啟前驗證 stage 與目前來源一致，不執行切換"
    - "title|§edev.toka.profiles.migration.ProfileMigration import <來源.json> <sqlite|json|yaml> <新資料目錄> <備份目錄> §7- §b離線一次性匯入並備份、讀回比對"
    - "title|§edev.toka.profiles.migration.ProfileMigration export-jdbc <jdbc:mysql:網址> <帳號> <輸出.json> §7- §b唯讀匯出 playerData 快照（密碼用 TOKA_DB_PASSWORD 或互動輸入）"
    - "title|§edev.toka.profiles.migration.ProfileMigration plan-permissions <來源.json> <輸出檔> §7- §b產生未審核的 LuckPerms 身分群組指令提案，不會執行"
    - "title|§edev.toka.profiles.migration.PlanResolution <來源.json> <Plan證據.json> <新私人目錄> §7- §b離線身分對照與封存輸出，不寫入正式資料"
    - "title|§7設定檔 staged.*（背景搬遷）與 migration.*（離線匯入）的說明見 config.yml 內的註解"

# ───────────────────────── 玩家／指令訊息（msg） ─────────────────────────
msg:
  title:
    # 查看稱號；${0}＝玩家名稱，${1}＝稱號（沒有時為 status.noTitle）
    show: "§7[玩家資料]§r §a${0}§b 的稱號：§a${1}"
    # 清除稱號；${0}＝玩家名稱
    cleared: "§7[玩家資料]§r §a已清除 ${0} 的稱號"
    # 自己的稱號；${0}＝稱號（沒有時為 status.noTitle）
    mine: "§7[玩家資料]§r §b你的稱號：§a${0}"
    mineCleared: "§7[玩家資料]§r §a已清除你的稱號"
    # ${0}＝新稱號
    mineSet: "§7[玩家資料]§r §a你的稱號已設為：§r${0}"
    # 設定稱號；${0}＝玩家名稱，${1}＝新稱號
    set: "§7[玩家資料]§r §a已將 ${0} 的稱號設為：§r${1}"

# ───────────────────────── 錯誤與拒絕（err） ─────────────────────────
err:
  noTitlePermission: "§7[玩家資料]§r §c您沒有權限修改稱號。"
  profilesNotReady: "§7[玩家資料]§r §c玩家資料尚未就緒，稱號未更動。"
  playerOnly: "§7[玩家資料]§r §c此指令只能在遊戲內使用。"
  # 用法錯誤；${0}＝用法文字（cmd.profiles.usageTitle）
  usage: "§7[玩家資料]§r §c用法：§e${0}"
  title:
    # ${0}＝長度上限
    tooLong: "§7[玩家資料]§r §c稱號最長 ${0} 個字元"
    control: "§7[玩家資料]§r §c稱號不能包含控制字元或換行"
    selfNoProfile: "§7[玩家資料]§r §c找不到你的玩家資料，稱號未更動。"
    selfColour: "§7[玩家資料]§r §c你沒有使用色碼的權限，稱號不能含 § 或 &。"
    selfBlank: "§7[玩家資料]§r §c稱號不能是空白；要移除請用 clear。"
    # ${0}＝長度上限（不含色碼）
    selfLong: "§7[玩家資料]§r §c稱號最長 ${0} 個字（不含色碼）"
    selfBlocked: "§7[玩家資料]§r §c稱號含有不允許的用詞。"
    # ${0}＝還要等幾秒
    selfWait: "§7[玩家資料]§r §e稱號剛改過，請再等 ${0} 秒。"
    # 稱號寫入失敗；${0}＝失敗原因（例外訊息或類別名稱）
    notSaved: "§7[玩家資料]§r §c稱號未儲存：${0}"
    # ${0}＝輸入的 UUID
    noUuid: "§7[玩家資料]§r §c找不到這個 UUID 的玩家資料：${0}"
    # ${0}＝輸入的玩家名稱
    noPlayer: "§7[玩家資料]§r §c找不到玩家「${0}」的資料"
    ambiguous: "§7[玩家資料]§r §c「${0}」對應到多筆玩家資料，需改用 UUID"
  # 以下為啟動與遷移流程的例外訊息（會寫進後台 log，給管理員判讀），不含前綴
  path:
    outside: "路徑必須位於插件資料目錄內"
    symlink: "不接受符號連結"
  activate:
    needRefresh: "切換前必須停服並重新匯出來源，再確認來源已更新"
    saveFailed: "切換設定保存失敗；未開啟新資料集"
  stage:
    notIndependent: "搬遷與有效資料目錄必須獨立"
  import:
    notConfirmed: "搬遷尚未確認；不建立空白資料"
    sourceOutside: "來源必須在插件資料目錄內"
    hashMismatch: "來源雜湊未確認或不符"
    saveFailed: "匯入完成但設定保存失敗，需人工核對，不可重複匯入"

# ───────────────────────── 表單與命令列提示（ui） ─────────────────────────
ui:
  cityPass:
    # 城市通表單標題
    title: "城市通"
    # 內容；${0}＝玩家名稱，${1}＝識別碼（profileId）。表單內不使用色碼
    content: "玩家：${0}\n識別碼：${1}"
    # 找不到玩家資料時的內容
    noData: "尚未完成玩家資料搬遷。"
    close: "關閉"
  # 命令列匯出工具要求輸入資料庫密碼時的提示
  passwordPrompt: "資料庫密碼："

# ───────────────────────── 後台文字（log） ─────────────────────────
log:
  # 啟動完成；${0}＝玩家資料筆數
  ready: "§btokaProfiles 就緒：§a${0} §b筆玩家資料"
  storageInitFailed: "§ctokaProfiles 儲存初始化失敗"
  activationFailed: "§e待啟用資料驗證失敗，繼續使用原資料來源"
  stagedStopped: "§c背景搬遷停止；有效資料未切換"
  # ${0}＝搬遷結果摘要（狀態、來源筆數、通過筆數、衝突數…）
  stagedDone: "§a背景搬遷完成：§b${0}§a；需停服更新來源與確認後才切換"
  stagedNotStarted: "§c背景搬遷未啟動；有效資料未切換"
  writerCloseFailed: "§e玩家資料寫入器未能正常關閉"
  # 寫進 stage 目錄 NOTICE.txt 的內容（給管理員看的檔案，不含色碼）
  stageNotice: "私人搬遷快照。不可加入 Git。ready 不代表正式資料已切換；線上來源仍須停服後補齊差異。"

# ───────────────────────── 狀態字（status） ─────────────────────────
status:
  # 玩家沒有稱號時顯示
  noTitle: "（沒有）"

plan:
  missing: '已要求啟用 Plan，但 Plan 尚未就緒；/${0} plan mode auto 可改為自動偵測。'
  detected: '已偵測到 Plan，目前模式 ${0}；/${1} plan status 可查看設定。'
  configureFailed: 'Plan 設定未完成：${0}。'
  noPermission: '§c沒有管理 Plan 展示的權限。'
  configured: '§aPlan 設定已儲存；/${0} plan status 可查看。'
  usage: '§e/${0} plan status | mode <auto|enable|disable> | fields <all|none|欄位...>'
  exists: '已有玩家資料'
  title: '玩家稱號'
  count: '正式玩家資料筆數'
  ready: 'Plan 玩家資訊整合已啟用。'
  unsupported: 'Plan 缺少 DataExtension Builder API，已略過玩家資訊整合。'
  unavailable: 'Plan 玩家資訊整合暫時不可用：${0}'
