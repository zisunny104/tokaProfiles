# tokaProfiles 繁體中文語系檔（zh-TW）
#
# 這個檔案放著插件所有「使用者看得到的文字」。伺服器擁有者可以把同名檔放進
# plugins/tokaProfiles/lang/zh-TW.yml 覆蓋個別文字，沒寫到的 key 仍使用 jar 內建的內容。
# 語言由 config.yml 的 language 決定。
#
# 參數：${0}、${1}… 依序代表程式傳入的值（只替換一次，缺少時保留原樣並警告）。
# 色碼慣例（與 tokaI18n 一致）：
#   §b 一般文字　§a 數字／名稱／值（寫成 §a${0}§b）　§e 警告／指令　§c 錯誤與拒絕
#   §7 用法與補充說明　§6 標題　§r 重設樣式
#   後台 log 不加方括號標籤；玩家訊息固定使用前綴「§7[玩家資料]§r 」。

# ───────────────────────── 指令說明與用法（cmd） ─────────────────────────
cmd:
  profiles:
    # /profile title 的用法
    usageTitle: "/profile title <玩家名稱或 UUID> [稱號 | clear]"

# ───────────────────────── /profile help（help） ─────────────────────────
# help.profiles：每行格式為「標籤|內容」，依權限過濾後分頁顯示（標籤與 | 不會顯示）：
#   *       所有人都顯示
#   self    需要 tokaProfiles.title.self 權限
#   title   需要 tokaProfiles.title.admin 權限
#   note    需要 tokaProfiles.note 權限
#   legacy  需要 tokaProfiles.legacy 權限
#   plan    需要 tokaProfiles.admin 權限
# 第一頁是一般玩家最常用的，主題各自用一行說明開頭。${0}＝稱號長度上限（目前 255）
help:
  footer: "§7第 §a${0}§7/§a${1}§7 頁，用 §e/profile help <頁碼>§7 換頁"
  profiles:
    - "*|§6=== §f§ltokaProfiles 說明§r §6=== §7（<必填>、[選填]）"
    - "*|§e/profile §7- §b開啟城市通（個人總覽、傳送、錢包、領地），限遊戲內玩家"
    - "*|§e/profile help [頁] §7- §b顯示此說明"
    - "self|§b自己的稱號（需要 tokaProfiles.title.self）："
    - "self|§e/profile mytitle §7- §b查看自己的稱號"
    - "self|§e/profile mytitle <稱號> §7- §b設定自己的稱號（有長度限制與等待時間；色碼需要 tokaProfiles.title.color，用 & 代替 §）"
    - "self|§e/profile mytitle clear §7- §b清除自己的稱號"
    - "title|§b玩家稱號（管理員，需要 tokaProfiles.title.admin）："
    - "title|§e/profile title <玩家名稱或 UUID> §7- §b查看該玩家目前的稱號"
    - "title|§e/profile title <玩家名稱或 UUID> <稱號> §7- §b設定稱號（可含空白與 § 色碼，最長 ${0} 個字元，不可含控制字元）"
    - "title|§e/profile title <玩家名稱或 UUID> clear §7- §b清除稱號"
    - "title|§7/profile titles 與 /profile title 相同；名稱對應多位玩家時用 UUID"
    - "note|§b備註與總覽（管理員，需要 tokaProfiles.note）："
    - "note|§e/profile <玩家名稱或 UUID> §7- §b開啟該玩家的個人總覽，含備註與舊名稱"
    - "note|§e/profile admin §7- §b開啟管理視窗：備註、舊名稱、玩家總覽"
    - "note|§e/profile note <玩家名稱或 UUID> §7- §b查看備註"
    - "note|§e/profile note <玩家名稱或 UUID> <文字> §7- §b以文字取代整份備註（最長 1000 字）"
    - "note|§e/profile note <玩家名稱或 UUID> clear §7- §b清除備註"
    - "legacy|§b舊名稱（管理員，需要 tokaProfiles.legacy）："
    - "legacy|§e/profile legacy [list] §7- §b列出舊名稱的筆數與等待確認的名稱"
    - "legacy|§e/profile legacy confirm <舊名稱> <玩家名稱或 UUID> §7- §b確認舊名稱歸屬於該玩家"
    - "plan|§b Plan 展示（管理員，需要 tokaProfiles.admin）："
    - "plan|§e/profile plan status §7- §b查看 Plan 展示設定"
    - "plan|§e/profile plan mode <auto|enable|disable> §7- §b設定 Plan 展示模式"
    - "plan|§e/profile plan fields <all|none|欄位...> §7- §b設定要展示的欄位（exists、title、count）"

# ───────────────────────── 玩家／指令訊息（msg） ─────────────────────────
msg:
  title:
    # 查看稱號；${0}＝玩家名稱，${1}＝稱號（沒有時為 status.noTitle）
    show: "§7[玩家資料]§r §a${0}§b 的稱號：§a${1}"
    # 清除稱號；${0}＝玩家名稱
    cleared: "§7[玩家資料]§r §a已清除 ${0} 的稱號"
    # 自己的稱號；${0}＝稱號（沒有時為 status.noTitle）
    mine: "§7[玩家資料]§r §b你的稱號：§a${0}"
    mineCleared: "§7[玩家資料]§r §a已清除你的稱號"
    # ${0}＝新稱號
    mineSet: "§7[玩家資料]§r §a你的稱號已設為：§r${0}"
    # 設定稱號；${0}＝玩家名稱，${1}＝新稱號
    set: "§7[玩家資料]§r §a已將 ${0} 的稱號設為：§r${1}"

