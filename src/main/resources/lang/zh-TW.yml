  usage: "§7用法：/profiles note <玩家或 UUID> [文字|clear]（不加文字是查看）"
  show: "§7[玩家資料]§r §b${0} 的備註：§f${1}"
  none: "§7[玩家資料]§r §b${0} 沒有備註"
  saved: "§7[玩家資料]§r §a已儲存 ${0} 的備註"
  cleared: "§7[玩家資料]§r §a已清除 ${0} 的備註"
  tooLong: "§7[玩家資料]§r §c備註最長 1000 字"
  donationUsage: "§7用法：/profiles donation <玩家或 UUID> <金額> [說明]"
  # ${0}＝玩家、${1}＝金額
  donationSaved: "§7[玩家資料]§r §a已記下 ${0} 的贊助 ${1}，獎勵由 tokaRewards 發放"
