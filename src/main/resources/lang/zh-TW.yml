# ───────────────────────── 表單與命令列提示（ui） ─────────────────────────
ui:
  cityPass:
    # 城市通表單標題
    title: "城市通"
    # 內容；${0}＝玩家名稱，${1}＝識別碼（profileId）。表單內不使用色碼
    content: "玩家：${0}\n識別碼：${1}"
    # 找不到玩家資料時的內容
    noData: "尚未完成玩家資料搬遷。"
    close: "關閉"
  # 命令列匯出工具要求輸入資料庫密碼時的提示
  passwordPrompt: "資料庫密碼："

# ───────────────────────── 後台文字（log） ─────────────────────────
log:
  # 啟動完成；${0}＝玩家資料筆數
  ready: "§btokaProfiles 就緒：§a${0} §b筆玩家資料"
  storageInitFailed: "§ctokaProfiles 儲存初始化失敗"
  activationFailed: "§e待啟用資料驗證失敗，繼續使用原資料來源"
  stagedStopped: "§c背景搬遷停止；有效資料未切換"
  # ${0}＝搬遷結果摘要（狀態、來源筆數、通過筆數、衝突數…）
  stagedDone: "§a背景搬遷完成：§b${0}§a；需停服更新來源與確認後才切換"
  stagedNotStarted: "§c背景搬遷未啟動；有效資料未切換"
  legacyImportFailed: "§c舊玩家資料匯入失敗：${0}"
  loginFailed: "§e玩家 ${0} 的檔案處理失敗：${1}"
  writerCloseFailed: "§e玩家資料寫入器未能正常關閉"
  # 寫進 stage 目錄 NOTICE.txt 的內容（給管理員看的檔案，不含色碼）
  stageNotice: "私人搬遷快照。不可加入 Git。ready 不代表正式資料已切換；線上來源仍須停服後補齊差異。"

welcome:
  # 新玩家第一次進服看到的引導（一頁，按「開始遊玩」才算完成）。${0}＝玩家名稱。
  page1:
    title: "KASTW - 歡迎加入"
    text: "嗨 ${0}，歡迎來到 §aKAS.TW§b 幻月殤恆生存伺服器§r！
我們是台灣的 MCBE 生存伺服器，從 2013 年一路玩到現在。這一頁幫你認識這裡，讀完就能出發囉。

§e>>先認識幾個地方§r
§b重生點§r：旁邊的傳送區可以直接去各處，身上的城市通（指南針）也能開傳送選單。
§b資源區§r：想挖礦、砍樹、蒐集材料就來這裡，全服只有這裡可以採集。
§b城市§r：你一進來就被分配了一座城市，在自己的城市買領地有優惠喔。
§b商店§r：把採來的東西賣掉賺銀幣，也可以買需要的東西，輸入 /shop 就能開商店。

§e>>錢與領地§r
銀幣是主要貨幣，金幣來自贊助和活動。要蓋房子先買領地：用木鋤破壞與點擊選出對角，再輸入 /land set <領地名稱>，/land tpl 設傳送點。

§e>>綁定 Discord§r
到我們的 Discord 完成綁定，就能在 Discord 和遊戲裡一起聊天、用指令，也是進服的資格。還沒綁定的話，記得去綁一下。

§e>>遊玩公約§r
‧ 和平都是生存地圖，建築要蓋在自己的領地內
‧ 和平都的道路與步道不能破壞
‧ 和平都不能挖礦、砍樹等採集，請到資源區
‧ 主世界城市的道路與上方 5 格不能更動
‧ 不破壞別人的建設
‧ 不使用外掛或非法物品
‧ 不向管理員要權限
‧ 說話文明、不刷屏
違規會依情節警告、扣除物資或封禁；有疑問或要申訴，請在十日內聯絡管理員。

§a準備好了就出發吧，玩得開心！§r"
  next: "下一頁 §8›"
  start: "開始遊玩 §8›"
