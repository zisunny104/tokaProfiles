# tokaProfiles 設定檔（繁體中文註解）
# 修改後需重新啟動伺服器才會套用。

# 顯示語言，決定 lang/<語言>.yml 的文字。目前提供：zh-TW（繁體中文）。
# 伺服器擁有者可在 plugins/tokaProfiles/lang/ 放同名檔案覆蓋個別文字。
language: zh-TW
# /profile help 每頁行數（3 以上的整數）
help-lines-per-page: 8

# 玩家資料的儲存方式
storage:
  # 儲存後端，可填：sqlite（預設）、json、yaml。
  # 切換後端不會自動搬移既有資料，不能直接改這裡。
  backend: sqlite
  # 背景寫入佇列容量，可填 1 以上的整數；佇列滿時寫入會被拒絕而不是無限堆積。
  queue-capacity: 128
  # 目前有效的資料目錄（相對於插件資料夾，必須在插件資料夾內，不接受符號連結）。
  active-directory: storage

# 選用 Plan 展示。預設 auto／all；使用管理指令即時切換。
plan:
  mode: auto # auto 自動偵測；enable 未就緒時提示；disable 不發布。
  fields: all # all | none | 欄位清單；指令可逐項管理。

# 名稱標籤最前面的身分標記（需要 tokaDisplay 的 ${prefix} 片段）。身分是權限節點 toka.identity.<名稱>；
# 標記文字（含括號與顏色）與群組名稱無關，留空代表不顯示。沒有任何身分的人顯示 ordinary。
identity:
  tags:
    admin: "§b[管]"
    sponsor: "§e[特]"
    linked: ""
    ordinary: "§6[普]"

# 名稱標籤中，稱號後面接的分隔文字（需要 tokaDisplay 0.4.0 以上）。沒有稱號就不顯示。
nametag:
  title-suffix: "§6-"

# 玩家自己修改稱號（/profile mytitle，需要權限 tokaProfiles.title.self，預設只有身分組被授予的人）。
title:
  self:
    # 稱號最長幾個字（不含色碼）。
    max-length: 16
    # 兩次修改之間要等幾秒；有 tokaProfiles.title.admin 的人不受限。
    cooldown-seconds: 300
    # 不允許的用詞（不分大小寫，比對時忽略空白與色碼）。
    blocked-words: []
